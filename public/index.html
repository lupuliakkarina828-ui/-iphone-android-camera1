<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Camera Link</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:22px;background:#111827;color:#f9fafb;font:16px system-ui,-apple-system,sans-serif;max-width:720px;margin-inline:auto}
    h1{font-size:27px;margin-bottom:8px}
    p{color:#cbd5e1;line-height:1.5}
    .card{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:18px;margin:14px 0}
    input,button{font:inherit;border-radius:10px;padding:13px;width:100%;margin:7px 0}
    input{border:1px solid #64748b;background:#0f172a;color:white}
    button{border:0;background:#2563eb;color:white;font-weight:650}
    button.secondary{background:#475569}
    button:disabled{opacity:.48}
    video{width:100%;max-height:65vh;background:#000;border-radius:12px;object-fit:contain}
    #status{padding:12px;background:#0f172a;border-radius:10px;white-space:pre-wrap}
    .small{font-size:13px;color:#94a3b8}
    .hidden{display:none}
  </style>
</head>
<body>
  <h1>Camera Link</h1>
  <p>Підключи два телефони через спільний код. Вони можуть бути в різних Wi‑Fi мережах.</p>

  <div class="card">
    <label for="room"><b>Спільний код кімнати</b></label>
    <input id="room" autocomplete="off" minlength="4" maxlength="32" placeholder="Наприклад: MoyaKamera27">
    <button id="sendBtn">Я передаю відео з цього телефона</button>
    <button id="viewBtn" class="secondary">Я дивлюся відео з іншого телефона</button>
    <button id="switchBtn" class="secondary hidden">Перемкнути передню / задню камеру</button>
    <button id="stopBtn" class="secondary" disabled>Зупинити / від'єднатися</button>
  </div>

  <div class="card">
    <video id="video" autoplay playsinline muted></video>
    <p id="status" role="status">Підключаємося до сервера…</p>
    <p class="small">На телефоні, який передає відео, дозволь доступ до камери. Для перегляду на іншому телефоні введи той самий код кімнати.</p>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const roomInput = $("room");
  const video = $("video");
  const status = $("status");
  const sendBtn = $("sendBtn");
  const viewBtn = $("viewBtn");
  const switchBtn = $("switchBtn");
  const stopBtn = $("stopBtn");

  const socket = io();
  let pc = null;
  let localStream = null;
  let role = null;
  let room = null;
  let pendingCandidates = [];
  let makingOffer = false;
  let facingMode = "environment";
  let videoSender = null;
  let starting = false;

  let rtcConfig = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" }
    ],
    iceCandidatePoolSize: 4
  };

  function setStatus(message) { status.textContent = message; }

  function setBusy(busy) {
    sendBtn.disabled = busy || starting;
    viewBtn.disabled = busy || starting;
    stopBtn.disabled = !busy && !starting;
  }

  socket.on("connect", () => setStatus("Є зв’язок із сервером. Введи код кімнати."));
  socket.on("connect_error", error => setStatus("Не вдалося підключитися до сервера: " + error.message));
  socket.on("disconnect", () => setStatus("Зв’язок із сервером втрачено. Перевір інтернет."));

  async function loadTurnConfig() {
    try {
      const response = await fetch("/turn-credentials", { cache: "no-store" });
      if (!response.ok) throw new Error("TURN не налаштований у Render Environment.");
      const creds = await response.json();
      rtcConfig.iceServers.push(
        { urls: "turn:global.relay.metered.ca:80", username: creds.username, credential: creds.credential },
        { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: creds.username, credential: creds.credential },
        { urls: "turn:global.relay.metered.ca:443", username: creds.username, credential: creds.credential },
        { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: creds.username, credential: creds.credential }
      );
      return true;
    } catch (error) {
      setStatus("Увага: " + error.message + " Поки що пробуємо пряме WebRTC-з’єднання.");
      return false;
    }
  }

  async function waitForSocket() {
    if (socket.connected) return;
    setStatus("Підключаємося до сервера…");
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        socket.off("connect", onConnect);
        reject(new Error("Сервер не відповідає. Онови сторінку й спробуй ще раз."));
      }, 12000);
      function onConnect() {
        clearTimeout(timer);
        resolve();
      }
      socket.once("connect", onConnect);
    });
  }

  async function joinRoom(selectedRole) {
    const code = roomInput.value.trim();
    if (!/^[A-Za-z0-9_-]{4,32}$/.test(code)) {
      alert("Введи код із 4–32 латинських літер, цифр, _ або -.");
      return false;
    }
    await waitForSocket();
    room = code;
    role = selectedRole;

    const result = await new Promise(resolve => {
      socket.timeout(10000).emit("join", { room, role }, (err, response) => {
        if (err) resolve({ ok: false, error: "Сервер не підтвердив вхід у кімнату." });
        else resolve(response);
      });
    });

    if (!result || !result.ok) {
      setStatus(result?.error || "Не вдалося увійти в кімнату.");
      room = null;
      role = null;
      return false;
    }
    setBusy(true);
    return true;
  }

  function makePeer() {
    pc = new RTCPeerConnection(rtcConfig);
    pc.onicecandidate = event => {
      if (event.candidate && room) socket.emit("signal", { room, data: { candidate: event.candidate } });
    };
    pc.ontrack = event => {
      video.srcObject = event.streams[0];
      video.muted = true;
      video.play().catch(() => {});
      setStatus("Відео отримано. З’єднання активне.");
    };
    pc.onconnectionstatechange = () => {
      if (!pc) return;
      if (pc.connectionState === "connected") setStatus("З’єднання активне. Відео передається.");
      else if (pc.connectionState === "failed") setStatus("Не вдалося з’єднати телефони. Перевір TURN-дані в Render.");
      else if (pc.connectionState === "disconnected") setStatus("Зв’язок перервався. Очікуємо відновлення…");
    };
    pc.oniceconnectionstatechange = () => {
      if (pc && ["connected", "completed"].includes(pc.iceConnectionState)) {
        setStatus("Захищене WebRTC-з’єднання встановлено.");
      }
    };
  }

  async function startSender() {
    if (starting) return;
    starting = true;
    setBusy(false);
    try {
      await waitForSocket();
      setStatus("Запитуємо доступ до камери…");
      localStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode } },
        audio: false
      });
      video.srcObject = localStream;
      video.muted = true;
      await loadTurnConfig();
      makePeer();
      const track = localStream.getVideoTracks()[0];
      videoSender = pc.addTrack(track, localStream);
      if (!await joinRoom("sender")) throw new Error("Не вдалося увійти в кімнату.");
      switchBtn.classList.remove("hidden");
      setStatus("Камера ввімкнена. Очікуємо інший телефон у цій кімнаті…");
    } catch (error) {
      setStatus("Не вдалося запустити передачу: " + error.message);
      await stop();
    } finally {
      starting = false;
      setBusy(Boolean(role));
    }
  }

  async function startViewer() {
    if (starting) return;
    starting = true;
    setBusy(false);
    try {
      await waitForSocket();
      await loadTurnConfig();
      makePeer();
      if (!await joinRoom("viewer")) throw new Error("Не вдалося увійти в кімнату.");
      setStatus("Очікуємо відео з іншого телефона…");
    } catch (error) {
      setStatus("Не вдалося підключитися: " + error.message);
      await stop();
    } finally {
      starting = false;
      setBusy(Boolean(role));
    }
  }

  async function switchCamera() {
    if (role !== "sender" || !pc || !videoSender || !localStream) return;
    switchBtn.disabled = true;
    const nextMode = facingMode === "environment" ? "user" : "environment";
    try {
      const newStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: nextMode } },
        audio: false
      });
      const newTrack = newStream.getVideoTracks()[0];
      await videoSender.replaceTrack(newTrack);
      const oldStream = localStream;
      localStream = newStream;
      facingMode = nextMode;
      video.srcObject = newStream;
      oldStream.getTracks().forEach(track => track.stop());
      setStatus(facingMode === "environment" ? "Увімкнена задня камера." : "Увімкнена передня камера.");
    } catch (error) {
      setStatus("Не вдалося перемкнути камеру: " + error.message);
    } finally {
      switchBtn.disabled = false;
    }
  }

  async function flushCandidates() {
    if (!pc || !pc.remoteDescription) return;
    const queued = pendingCandidates;
    pendingCandidates = [];
    for (const candidate of queued) {
      try { await pc.addIceCandidate(candidate); }
      catch (error) { console.warn("ICE candidate skipped", error); }
    }
  }

  socket.on("viewer-ready", async () => {
    if (role !== "sender" || !pc) return;
    try {
      makingOffer = true;
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit("signal", { room, data: { description: pc.localDescription } });
      setStatus("Запит на відеоз’єднання надіслано…");
    } catch (error) {
      setStatus("Помилка створення з’єднання: " + error.message);
    } finally {
      makingOffer = false;
    }
  });

  socket.on("signal", async data => {
    if (!pc || !data) return;
    try {
      if (data.description) {
        await pc.setRemoteDescription(data.description);
        await flushCandidates();
        if (data.description.type === "offer") {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          socket.emit("signal", { room, data: { description: pc.localDescription } });
          setStatus("Відповідь надіслана. Встановлюємо відеоз’єднання…");
        } else if (data.description.type === "answer") {
          setStatus("Відповідь отримана. Встановлюємо відеоз’єднання…");
        }
      }
      if (data.candidate) {
        if (pc.remoteDescription) await pc.addIceCandidate(data.candidate);
        else pendingCandidates.push(data.candidate);
      }
    } catch (error) {
      console.error(error);
      setStatus("Помилка WebRTC: " + error.message);
    }
  });

  socket.on("peer-left", () => setStatus("Інший телефон від’єднався."));

  async function stop() {
    if (room) socket.emit("leave");
    if (pc) { pc.ontrack = null; pc.close(); pc = null; }
    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }
    videoSender = null;
    video.srcObject = null;
    pendingCandidates = [];
    room = null;
    role = null;
    switchBtn.classList.add("hidden");
    setBusy(false);
    setStatus("Від’єднано.");
  }

  sendBtn.addEventListener("click", startSender);
  viewBtn.addEventListener("click", startViewer);
  switchBtn.addEventListener("click", switchCamera);
  stopBtn.addEventListener("click", stop);

  if (!window.isSecureContext) {
    setStatus("Для доступу до камери відкрий сайт через HTTPS.");
  }
})();
</script>
</body>
</html>
